  </g>
  <text x="188" y="257" text-anchor="end" font-size="10" fill="#555">4 female jumper ends</text>

  <!-- the wires -->
  <g>
    <path d="M220 262 V372 H568 V388" fill="none" stroke="#e9b912" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M240 262 V357 H688 V388" fill="none" stroke="#46a24e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M260 262 V342 H808 V388" fill="none" stroke="#3b82d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M200 262 V495 H832" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M592 472 V495" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M712 472 V495" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M832 472 V495" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
