<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Zuno – Analog-Buttons: the cable build</title>
  <desc>An Arduino Nano ESP32 from above with the USB-C connector on the right. Four female jumper ends sit on GND, D2, D3 and D4 of the pin row that ends in TX1. Each of the three 12 × 12 mm buttons hangs on two wires: the wire from its pin on one leg, the shared ground on the diagonally opposite leg. The ground runs from GND to button 1, on to button 2 and on to button 3. Button 1 is Pipi on D2, button 2 Gaggi on D3, button 3 Beides on D4.</desc>
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1b1b1b">Zuno – Analog-Buttons · the cable build</text>
  <text x="24" y="56" font-size="12" fill="#555">Arduino Nano ESP32 from above, USB-C on the right · three 12 × 12 mm buttons on wires · no resistor, no diode, no extra power</text>

