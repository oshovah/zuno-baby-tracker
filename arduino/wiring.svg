    <circle cx="813" cy="423" r="6" fill="#fff" fill-opacity="0.35"/>
    <text x="820" y="435" text-anchor="middle" font-size="15" font-weight="700" fill="#173f73">3</text>
    <text x="820" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1b1b">3 · Beides</text>
    <text x="820" y="541" text-anchor="middle" font-size="11" fill="#555">D4 · {"kind":"both"}</text>
  </g>

  <text font-size="11.5" fill="#333" y="96">
      <tspan x="500" dy="0">GND · D2 · D3 · D4 sit side by side on the row that ends in TX1</tspan>
      <tspan x="500" dy="15">(GND is the square pad): four female jumper ends in a row.</tspan>
      <tspan x="500" dy="24">Each button: the wire from its pin on one leg, the ground on the</tspan>
      <tspan x="500" dy="15">diagonally opposite leg — two legs of a pair are joined inside the</tspan>
      <tspan x="500" dy="15">button, diagonal legs never are.</tspan>
      <tspan x="500" dy="24">The ground is one wire from button to button: the incoming and the</tspan>
      <tspan x="500" dy="15">outgoing wire share a leg (twisted together, soldered on at once).</tspan>
      <tspan x="500" dy="24">No resistor, no diode, no power wire: the Nano pulls the pins up</tspan>
      <tspan x="500" dy="15">itself. The wire colours only tell the three apart.</tspan>
  </text>
</svg>
