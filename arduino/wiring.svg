  <rect x="441" y="157" width="36" height="36" rx="5" fill="#b5b5b5" stroke="#6b6b6b"/>
  <text x="459" y="208" text-anchor="middle" font-size="9" fill="#555">USB-C</text>
  <text x="285" y="183" text-anchor="middle" font-size="12" fill="#d7ecef">Arduino Nano ESP32 · from above</text>
