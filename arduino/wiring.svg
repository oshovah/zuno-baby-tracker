    <rect x="590" y="388" width="4" height="12" fill="#c4c4c4" stroke="#6e6e6e" stroke-width="0.8"/>
    <rect x="566" y="460" width="4" height="12" fill="#c4c4c4" stroke="#6e6e6e" stroke-width="0.8"/>
